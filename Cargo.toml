[package]
name = "monitor-ddc"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "A Windows DDC/CI monitor brightness and contrast controller"
license = "MIT"

[[bin]]
name = "MonitorDDC"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "0.24.2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
